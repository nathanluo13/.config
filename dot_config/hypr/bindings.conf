# ============================================================================
# Omarchy keybindings — managed by chezmoi (Omarchy only)
#
# Aerospace-style: ALT is the WM modifier (this keyboard has no Super key).
# This file is sourced AFTER Omarchy's defaults, so these win. The default
# SUPER binds are left intact but inert (no Super key to press them).
#
# Modifier roles:
#   ALT              + <ws key>   switch workspace        (1-0 q-p a-g z-m)
#   ALT SHIFT        + <ws key>   move window to workspace
#   ALT              + h/j/k/l    focus  left/down/up/right
#   ALT SHIFT        + h/j/k/l    move   window l/d/u/r
#   ALT              + <symbol>   core WM + terminal/launcher (see below)
#   ALT CTRL         + <letter>   launch app (Omarchy mnemonics)
#   ALT CTRL SHIFT   + <letter>   secondary window ops / app variants
# ============================================================================

$mod = ALT

# --- Free ALT keys that Omarchy defaults grab -------------------------------
unbind = ALT, TAB
unbind = ALT SHIFT, TAB

# --- Core: terminal, launcher, menus (ALT + symbol keys are collision-free) -
bindd = $mod, RETURN, Terminal, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)"
bindd = $mod, SPACE, Launch apps, exec, omarchy-launch-walker
bindd = $mod, ESCAPE, System menu, exec, omarchy-menu system
bindd = $mod, TAB, Last workspace, workspace, previous
bindd = $mod, grave, Toggle scratchpad, togglespecialworkspace, scratchpad

# --- Window management (ALT + symbol keys; letters are workspaces) ----------
bindd = $mod, BACKSPACE, Close window, killactive
bindd = $mod, BACKSLASH, Fullscreen, fullscreen, 0
bindd = $mod, COMMA, Toggle floating, togglefloating
bindd = $mod, PERIOD, Toggle split, layoutmsg, togglesplit
bindd = $mod, minus, Shrink window, resizeactive, -100 0
bindd = $mod, equal, Grow window, resizeactive, 100 0

# --- Focus (ALT + h/j/k/l) --------------------------------------------------
bindd = $mod, H, Focus left, movefocus, l
bindd = $mod, J, Focus down, movefocus, d
bindd = $mod, K, Focus up, movefocus, u
bindd = $mod, L, Focus right, movefocus, r

# --- Move window (ALT SHIFT + h/j/k/l) --------------------------------------
bindd = $mod SHIFT, H, Move window left, movewindow, l
bindd = $mod SHIFT, J, Move window down, movewindow, d
bindd = $mod SHIFT, K, Move window up, movewindow, u
bindd = $mod SHIFT, L, Move window right, movewindow, r

# --- Switch workspace (ALT + key) -------------------------------------------
# Number row 1..0 -> numbered workspaces 1..10
bindd = $mod, 1, Workspace 1, workspace, 1
bindd = $mod, 2, Workspace 2, workspace, 2
bindd = $mod, 3, Workspace 3, workspace, 3
bindd = $mod, 4, Workspace 4, workspace, 4
bindd = $mod, 5, Workspace 5, workspace, 5
bindd = $mod, 6, Workspace 6, workspace, 6
bindd = $mod, 7, Workspace 7, workspace, 7
bindd = $mod, 8, Workspace 8, workspace, 8
bindd = $mod, 9, Workspace 9, workspace, 9
bindd = $mod, 0, Workspace 10, workspace, 10
# Top row q..p -> named workspaces Q..P
bindd = $mod, Q, Workspace Q, workspace, name:Q
bindd = $mod, W, Workspace W, workspace, name:W
bindd = $mod, E, Workspace E, workspace, name:E
bindd = $mod, R, Workspace R, workspace, name:R
bindd = $mod, T, Workspace T, workspace, name:T
bindd = $mod, Y, Workspace Y, workspace, name:Y
bindd = $mod, U, Workspace U, workspace, name:U
bindd = $mod, I, Workspace I, workspace, name:I
bindd = $mod, O, Workspace O, workspace, name:O
bindd = $mod, P, Workspace P, workspace, name:P
# Home row a..g -> named workspaces A..G (h/j/k/l reserved for focus)
bindd = $mod, A, Workspace A, workspace, name:A
bindd = $mod, S, Workspace S, workspace, name:S
bindd = $mod, D, Workspace D, workspace, name:D
bindd = $mod, F, Workspace F, workspace, name:F
bindd = $mod, G, Workspace G, workspace, name:G
# Bottom row z..m -> named workspaces Z..M
bindd = $mod, Z, Workspace Z, workspace, name:Z
bindd = $mod, X, Workspace X, workspace, name:X
bindd = $mod, C, Workspace C, workspace, name:C
bindd = $mod, V, Workspace V, workspace, name:V
bindd = $mod, B, Workspace B, workspace, name:B
bindd = $mod, N, Workspace N, workspace, name:N
bindd = $mod, M, Workspace M, workspace, name:M

# --- Move window to workspace (ALT SHIFT + key) -----------------------------
bindd = $mod SHIFT, 1, Move to workspace 1, movetoworkspace, 1
bindd = $mod SHIFT, 2, Move to workspace 2, movetoworkspace, 2
bindd = $mod SHIFT, 3, Move to workspace 3, movetoworkspace, 3
bindd = $mod SHIFT, 4, Move to workspace 4, movetoworkspace, 4
bindd = $mod SHIFT, 5, Move to workspace 5, movetoworkspace, 5
bindd = $mod SHIFT, 6, Move to workspace 6, movetoworkspace, 6
bindd = $mod SHIFT, 7, Move to workspace 7, movetoworkspace, 7
bindd = $mod SHIFT, 8, Move to workspace 8, movetoworkspace, 8
bindd = $mod SHIFT, 9, Move to workspace 9, movetoworkspace, 9
bindd = $mod SHIFT, 0, Move to workspace 10, movetoworkspace, 10
bindd = $mod SHIFT, Q, Move to workspace Q, movetoworkspace, name:Q
bindd = $mod SHIFT, W, Move to workspace W, movetoworkspace, name:W
bindd = $mod SHIFT, E, Move to workspace E, movetoworkspace, name:E
bindd = $mod SHIFT, R, Move to workspace R, movetoworkspace, name:R
bindd = $mod SHIFT, T, Move to workspace T, movetoworkspace, name:T
bindd = $mod SHIFT, Y, Move to workspace Y, movetoworkspace, name:Y
bindd = $mod SHIFT, U, Move to workspace U, movetoworkspace, name:U
bindd = $mod SHIFT, I, Move to workspace I, movetoworkspace, name:I
bindd = $mod SHIFT, O, Move to workspace O, movetoworkspace, name:O
bindd = $mod SHIFT, P, Move to workspace P, movetoworkspace, name:P
bindd = $mod SHIFT, A, Move to workspace A, movetoworkspace, name:A
bindd = $mod SHIFT, S, Move to workspace S, movetoworkspace, name:S
bindd = $mod SHIFT, D, Move to workspace D, movetoworkspace, name:D
bindd = $mod SHIFT, F, Move to workspace F, movetoworkspace, name:F
bindd = $mod SHIFT, G, Move to workspace G, movetoworkspace, name:G
bindd = $mod SHIFT, Z, Move to workspace Z, movetoworkspace, name:Z
bindd = $mod SHIFT, X, Move to workspace X, movetoworkspace, name:X
bindd = $mod SHIFT, C, Move to workspace C, movetoworkspace, name:C
bindd = $mod SHIFT, V, Move to workspace V, movetoworkspace, name:V
bindd = $mod SHIFT, B, Move to workspace B, movetoworkspace, name:B
bindd = $mod SHIFT, N, Move to workspace N, movetoworkspace, name:N
bindd = $mod SHIFT, M, Move to workspace M, movetoworkspace, name:M

# --- App launchers (ALT CTRL + letter; relocated from SUPER SHIFT) ----------
bindd = $mod CTRL, RETURN, Tmux, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)" bash -c "tmux attach || tmux new -s Work"
bindd = $mod CTRL, B, Browser, exec, omarchy-launch-browser
bindd = $mod CTRL, N, Editor, exec, omarchy-launch-editor
bindd = $mod CTRL, O, Obsidian, exec, omarchy-launch-or-focus ^obsidian$ "uwsm-app -- obsidian"
bindd = $mod CTRL, F, File manager, exec, uwsm-app -- nautilus --new-window
bindd = $mod CTRL, M, Music, exec, omarchy-launch-or-focus spotify
bindd = $mod CTRL, D, Docker, exec, omarchy-launch-tui lazydocker
bindd = $mod CTRL, G, Signal, exec, omarchy-launch-or-focus ^signal$ "uwsm-app -- signal-desktop"
bindd = $mod CTRL, C, Calendar, exec, omarchy-launch-webapp "https://app.hey.com/calendar/weeks/"
bindd = $mod CTRL, E, Email, exec, omarchy-launch-webapp "https://app.hey.com"
bindd = $mod CTRL, Y, YouTube, exec, omarchy-launch-webapp "https://youtube.com/"
bindd = $mod CTRL, A, ChatGPT, exec, omarchy-launch-webapp "https://chatgpt.com"
bindd = $mod CTRL, X, X, exec, omarchy-launch-webapp "https://x.com/"
bindd = $mod CTRL, SLASH, Passwords, exec, uwsm-app -- 1password

# --- Secondary window ops + app variants (ALT CTRL SHIFT) -------------------
bindd = $mod CTRL SHIFT, T, Toggle floating, togglefloating
bindd = $mod CTRL SHIFT, G, Toggle grouping, togglegroup
bindd = $mod CTRL SHIFT, P, Pseudo window, pseudo
bindd = $mod CTRL SHIFT, B, Browser (private), exec, omarchy-launch-browser --private
bindd = $mod CTRL SHIFT, A, Grok, exec, omarchy-launch-webapp "https://grok.com"
bindd = $mod CTRL SHIFT, M, Music TUI, exec, omarchy-launch-or-focus-tui cliamp
