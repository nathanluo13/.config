# ============================================================================
# Omarchy keybindings — managed by chezmoi (Omarchy only)
#
# Dual-modifier layout:
#   SUPER  = full stock Omarchy (apps, menus, clipboard/paste, tiling) — untouched
#   ALT    = Aerospace-style window management (added on top), so tiling can be
#            driven from Alt regardless of the Super key.
#
# Section A restores the Super app launchers (this file replaces Omarchy's
# starter ~/.config/hypr/bindings.conf). Section B adds the Alt WM scheme.
# Everything else Super-related (paste = SUPER+V, walker = SUPER+SPACE, close =
# SUPER+W, clipboard = SUPER CTRL+V, ...) comes from Omarchy's defaults, which
# are sourced before this file and left fully intact.
# ============================================================================

# ────────────────────────────────────────────────────────────────────────────
# Section A — Super application launchers (restored)
# ────────────────────────────────────────────────────────────────────────────
bindd = SUPER, RETURN, Terminal, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)"
bindd = SUPER ALT, RETURN, Tmux, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)" bash -c "tmux attach || tmux new -s Work"
bindd = SUPER SHIFT, RETURN, Browser, exec, omarchy-launch-browser
bindd = SUPER SHIFT, F, File manager, exec, uwsm-app -- nautilus --new-window
bindd = SUPER ALT SHIFT, F, File manager (cwd), exec, uwsm-app -- nautilus --new-window "$(omarchy-cmd-terminal-cwd)"
bindd = SUPER SHIFT, B, Browser, exec, omarchy-launch-browser
bindd = SUPER SHIFT ALT, B, Browser (private), exec, omarchy-launch-browser --private
bindd = SUPER SHIFT, M, Music, exec, omarchy-launch-or-focus spotify
bindd = SUPER SHIFT ALT, M, Music TUI, exec, omarchy-launch-or-focus-tui cliamp
bindd = SUPER SHIFT, N, Editor, exec, omarchy-launch-editor
bindd = SUPER SHIFT, D, Docker, exec, omarchy-launch-tui lazydocker
bindd = SUPER SHIFT, G, Signal, exec, omarchy-launch-or-focus ^signal$ "uwsm-app -- signal-desktop"
bindd = SUPER SHIFT, O, Obsidian, exec, omarchy-launch-or-focus ^obsidian$ "uwsm-app -- obsidian"
bindd = SUPER SHIFT, W, Typora, exec, uwsm-app -- typora --enable-wayland-ime
bindd = SUPER SHIFT, SLASH, Passwords, exec, uwsm-app -- 1password

# If your web app url contains #, type it as ## to prevent hyprland treating it as a comment
bindd = SUPER SHIFT, A, ChatGPT, exec, omarchy-launch-webapp "https://chatgpt.com"
bindd = SUPER SHIFT ALT, A, Grok, exec, omarchy-launch-webapp "https://grok.com"
bindd = SUPER SHIFT, C, Calendar, exec, omarchy-launch-webapp "https://app.hey.com/calendar/weeks/"
bindd = SUPER SHIFT, E, Email, exec, omarchy-launch-webapp "https://app.hey.com"
bindd = SUPER SHIFT, Y, YouTube, exec, omarchy-launch-webapp "https://youtube.com/"
bindd = SUPER SHIFT ALT, G, WhatsApp, exec, omarchy-launch-or-focus-webapp WhatsApp "https://web.whatsapp.com/"
bindd = SUPER SHIFT CTRL, G, Google Messages, exec, omarchy-launch-or-focus-webapp "Google Messages" "https://messages.google.com/web/conversations"
bindd = SUPER SHIFT, P, Google Photos, exec, omarchy-launch-or-focus-webapp "Google Photos" "https://photos.google.com/"
bindd = SUPER SHIFT, X, X, exec, omarchy-launch-webapp "https://x.com/"
bindd = SUPER SHIFT ALT, X, X Post, exec, omarchy-launch-webapp "https://x.com/compose/post"

# ────────────────────────────────────────────────────────────────────────────
# Section B — Alt window management (Aerospace-style)
#   ALT       + <ws key>   switch workspace     (1-0 q-p a-g z-m)
#   ALT SHIFT + <ws key>   move window to workspace
#   ALT       + h/j/k/l    focus  left/down/up/right
#   ALT SHIFT + h/j/k/l    move   window l/d/u/r
#   ALT       + symbol     window actions (see below)
# Non-WM actions (terminal, launcher, menus, clipboard) stay on Super.
# ────────────────────────────────────────────────────────────────────────────
$mod = ALT

# Window actions (symbol keys — letters are workspaces)
# (close window is SUPER+W — no Alt close bind)
bindd = $mod, BACKSLASH, Fullscreen, fullscreen, 0
bindd = $mod, COMMA, Toggle floating, togglefloating
bindd = $mod, PERIOD, Toggle split, layoutmsg, togglesplit
bindd = $mod, minus, Shrink window, resizeactive, -100 0
bindd = $mod, equal, Grow window, resizeactive, 100 0
bindd = $mod, grave, Toggle scratchpad, togglespecialworkspace, scratchpad

# Focus (ALT + h/j/k/l)
bindd = $mod, H, Focus left, movefocus, l
bindd = $mod, J, Focus down, movefocus, d
bindd = $mod, K, Focus up, movefocus, u
bindd = $mod, L, Focus right, movefocus, r

# Move window (ALT SHIFT + h/j/k/l)
bindd = $mod SHIFT, H, Move window left, movewindow, l
bindd = $mod SHIFT, J, Move window down, movewindow, d
bindd = $mod SHIFT, K, Move window up, movewindow, u
bindd = $mod SHIFT, L, Move window right, movewindow, r

# Switch workspace (ALT + key): numbers 1..0 -> ws 1..10, letters -> named ws
bindd = $mod, 1, Workspace 1, workspace, 1
bindd = $mod, 2, Workspace 2, workspace, 2
bindd = $mod, 3, Workspace 3, workspace, 3
bindd = $mod, 4, Workspace 4, workspace, 4
bindd = $mod, 5, Workspace 5, workspace, 5
bindd = $mod, 6, Workspace 6, workspace, 6
bindd = $mod, 7, Workspace 7, workspace, 7
bindd = $mod, 8, Workspace 8, workspace, 8
bindd = $mod, 9, Workspace 9, workspace, 9
bindd = $mod, 0, Workspace 10, workspace, 10
bindd = $mod, Q, Workspace Q, workspace, name:Q
bindd = $mod, W, Workspace W, workspace, name:W
bindd = $mod, E, Workspace E, workspace, name:E
bindd = $mod, R, Workspace R, workspace, name:R
bindd = $mod, T, Workspace T, workspace, name:T
bindd = $mod, Y, Workspace Y, workspace, name:Y
bindd = $mod, U, Workspace U, workspace, name:U
bindd = $mod, I, Workspace I, workspace, name:I
bindd = $mod, O, Workspace O, workspace, name:O
bindd = $mod, P, Workspace P, workspace, name:P
bindd = $mod, A, Workspace A, workspace, name:A
bindd = $mod, S, Workspace S, workspace, name:S
bindd = $mod, D, Workspace D, workspace, name:D
bindd = $mod, F, Workspace F, workspace, name:F
bindd = $mod, G, Workspace G, workspace, name:G
bindd = $mod, Z, Workspace Z, workspace, name:Z
bindd = $mod, X, Workspace X, workspace, name:X
bindd = $mod, C, Workspace C, workspace, name:C
bindd = $mod, V, Workspace V, workspace, name:V
bindd = $mod, B, Workspace B, workspace, name:B
bindd = $mod, N, Workspace N, workspace, name:N
bindd = $mod, M, Workspace M, workspace, name:M

# Move window to workspace (ALT SHIFT + key)
bindd = $mod SHIFT, 1, Move to workspace 1, movetoworkspace, 1
bindd = $mod SHIFT, 2, Move to workspace 2, movetoworkspace, 2
bindd = $mod SHIFT, 3, Move to workspace 3, movetoworkspace, 3
bindd = $mod SHIFT, 4, Move to workspace 4, movetoworkspace, 4
bindd = $mod SHIFT, 5, Move to workspace 5, movetoworkspace, 5
bindd = $mod SHIFT, 6, Move to workspace 6, movetoworkspace, 6
bindd = $mod SHIFT, 7, Move to workspace 7, movetoworkspace, 7
bindd = $mod SHIFT, 8, Move to workspace 8, movetoworkspace, 8
bindd = $mod SHIFT, 9, Move to workspace 9, movetoworkspace, 9
bindd = $mod SHIFT, 0, Move to workspace 10, movetoworkspace, 10
bindd = $mod SHIFT, Q, Move to workspace Q, movetoworkspace, name:Q
bindd = $mod SHIFT, W, Move to workspace W, movetoworkspace, name:W
bindd = $mod SHIFT, E, Move to workspace E, movetoworkspace, name:E
bindd = $mod SHIFT, R, Move to workspace R, movetoworkspace, name:R
bindd = $mod SHIFT, T, Move to workspace T, movetoworkspace, name:T
bindd = $mod SHIFT, Y, Move to workspace Y, movetoworkspace, name:Y
