# Managed by chezmoi (Omarchy only). Overrides Omarchy's default hypridle.
#
# No idle interruptions: the machine never launches the screensaver, never
# auto-locks, and never blanks/suspends from inactivity (there are simply no
# idle listeners below). Manual `systemctl suspend` still locks first, via
# before_sleep_cmd, so a deliberately-suspended machine isn't left unlocked.

general {
    lock_cmd = omarchy-system-lock
    before_sleep_cmd = OMARCHY_LOCK_ONLY=true omarchy-system-lock
    after_sleep_cmd = sleep 1 && omarchy-system-wake
    inhibit_sleep = 3
}

# (intentionally no `listener {}` blocks — no screensaver, no auto-lock, no idle sleep)
